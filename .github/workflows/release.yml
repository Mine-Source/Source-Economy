name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar tag y extraer versión
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "Tag inválido: $TAG (usa vX.Y.Z)"; exit 1; fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar y ejecutar pruebas
        run: gradle --no-daemon --stacktrace check build -PreleaseVersion=${{ steps.ver.outputs.version }}
      - name: Verificar JAR
        run: |
          JAR="economycore-plugin/build/libs/EconomyCore-${{ steps.ver.outputs.version }}.jar"
          test -f "$JAR"
          unzip -l "$JAR" | grep -q 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -q "version: '${{ steps.ver.outputs.version }}'"
          unzip -l "$JAR" | grep -q 'com/economycore/plugin/EconomyCorePlugin.class'
          unzip -l "$JAR" | grep -q 'com/economycore/core/MarketEngine.class'
          unzip -l "$JAR" | grep -q 'com/economycore/api/MarketService.class'
      - uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: economycore-plugin/build/libs/EconomyCore-${{ steps.ver.outputs.version }}.jar
          if-no-files-found: error

  publish:
    needs: build            # solo se ejecuta si compilación y pruebas pasaron
    runs-on: ubuntu-latest
    permissions:
      contents: write       # único permiso de escritura: crear el Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: dist
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          FLAGS=""
          if [[ "$VERSION" == *-* ]]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "dist/EconomyCore-${VERSION}.jar" \
            --title "EconomyCore ${VERSION}" --generate-notes --verify-tag $FLAGS
