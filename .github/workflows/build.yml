name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar y ejecutar pruebas
        run: gradle --no-daemon --stacktrace check build
      - name: Verificar JAR
        run: |
          JAR=$(ls economycore-plugin/build/libs/EconomyCore-*.jar)
          echo "JAR: $JAR"
          unzip -l "$JAR" | grep -q 'plugin.yml'
          unzip -l "$JAR" | grep -q 'com/economycore/plugin/EconomyCorePlugin.class'
          unzip -l "$JAR" | grep -q 'com/economycore/core/MarketEngine.class'
          unzip -l "$JAR" | grep -q 'com/economycore/api/MarketService.class'
      - uses: actions/upload-artifact@v4
        with:
          name: EconomyCore-jar
          path: economycore-plugin/build/libs/EconomyCore-*.jar
          if-no-files-found: error
