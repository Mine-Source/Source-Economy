name: EconomyCore
version: '${version}'
main: com.economycore.plugin.EconomyCorePlugin
api-version: '1.20'
description: Plataforma económica y multimercado para servidores Minecraft.
commands:
  markets:
    description: Lista los mercados registrados.
    usage: /markets [list]
    permission: economy.market.use
permissions:
  economy.market.use:
    default: true
  economy.market.admin:
    default: op
